name: Problema tecnico
description: Malfunzionamento dell'applicazione (visualizzazione, calcolatori, ricerca, offline)
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: descrizione
    attributes:
      label: Che cosa succede
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: Come riprodurlo
      placeholder: "1. apro la sezione…  2. seleziono…  3. compare…"
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Dispositivo e browser
      placeholder: "es. iPhone 14, Safari 18 / Windows 11, Chrome 131"
  - type: dropdown
    id: sezione
    attributes:
      label: Sezione
      options: [Farmaci, Terapia per patologia, Simulazione, Confronto, Interazioni, Calcolatori, Classi, Info, Installazione offline, Altro]
