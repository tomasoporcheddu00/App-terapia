name: Pubblicazione su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validazione:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validazione dei contenuti clinici
        run: python3 tools/validate_data.py
      - name: Allineamento app e data/
        run: python3 tools/extract_data.py
      - name: Controllo sintassi JavaScript
        run: |
          python3 - <<'PY'
          import re
          h=open('index.html',encoding='utf-8').read()
          assert '__DATA__' not in h, 'segnaposto __DATA__ non sostituito'
          s=h[h.index('<script>')+8:h.rindex('</script>')]
          s=re.sub(r"const DATA = \{.*?\};\nlet query",
                   "const DATA={drugs:[],classes:{},classOrder:[],pathologies:[],areaOrder:[],regulatory:{},dosing:{},interactions:{}};\nlet query",
                   s,count=1,flags=re.S)
          open('/tmp/app.js','w').write(s)
          PY
          node --check /tmp/app.js

  pubblicazione:
    needs: validazione
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
